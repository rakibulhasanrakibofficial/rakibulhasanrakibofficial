<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">What keeps this shinobi curious</title><desc id="d">A rotating card carousel of learning, coding, problem solving, AI exploration and open source.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10131c"/><stop offset="1" stop-color="#281512"/></linearGradient><linearGradient id="o"><stop stop-color="#ffd08a"/><stop offset=".5" stop-color="#ff762e"/><stop offset="1" stop-color="#c52b2c"/></linearGradient></defs><rect width="1000" height="340" rx="18" fill="url(#bg)" stroke="#ff7838" stroke-opacity=".8"/><text x="34" y="45" fill="#ffb36b" font-family="Segoe UI,Arial" font-size="21" font-weight="900">05 • WHAT KEEPS ME CURIOUS</text><text x="34" y="70" fill="#cfc3bb" font-family="Segoe UI,Arial" font-size="12">A small carousel of interests and learning missions</text><g font-family="Segoe UI,Arial" text-anchor="middle"><g><rect x="40" y="100" width="920" height="180" rx="16" fill="#171d28" stroke="#ff7838" stroke-width="2"/><g fill="#ffb36b"><text x="500" y="178" font-size="56">⌘</text></g><text x="500" y="222" fill="#fff0e5" font-size="26" font-weight="900">CODING & BUILDING</text><text x="500" y="250" fill="#cfc3bb" font-size="14">Turning ideas into useful software, one project at a time</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.18;.22;.96;1" dur="15s" repeatCount="indefinite"/></g><g opacity="0"><rect x="40" y="100" width="920" height="180" rx="16" fill="#171d28" stroke="#ff7838" stroke-width="2"/><text x="500" y="178" fill="#ffb36b" font-size="56">✦</text><text x="500" y="222" fill="#fff0e5" font-size="26" font-weight="900">PROBLEM SOLVING</text><text x="500" y="250" fill="#cfc3bb" font-size="14">Breaking hard challenges into clear, testable steps</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.18;.22;.96;1" dur="15s" repeatCount="indefinite"/></g><g opacity="0"><rect x="40" y="100" width="920" height="180" rx="16" fill="#171d28" stroke="#ff7838" stroke-width="2"/><text x="500" y="178" fill="#ffb36b" font-size="56">◎</text><text x="500" y="222" fill="#fff0e5" font-size="26" font-weight="900">AI / ML EXPLORATION</text><text x="500" y="250" fill="#cfc3bb" font-size="14">Experimenting with intelligent tools and practical use cases</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.18;.22;.96;1" dur="15s" repeatCount="indefinite"/></g></g><g fill="#ff9b55"><circle cx="465" cy="308" r="5"><animate attributeName="opacity" values="1;.2;1" dur="15s" repeatCount="indefinite"/></circle><circle cx="490" cy="308" r="5" opacity=".35"/><circle cx="515" cy="308" r="5" opacity=".35"/></g></svg>