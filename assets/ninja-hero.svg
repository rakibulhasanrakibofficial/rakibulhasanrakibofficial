<g font-family="Segoe UI,Arial,sans-serif">
 <text x="58" y="58" fill="#ffb36b" font-size="14" font-weight="800" letter-spacing="4">THE SHINOBI DEVELOPER FILE</text>
 <text x="58" y="132" fill="#fff2e9" font-size="48" font-weight="900">RAKIBUL HASAN RAKIB</text>
 <text x="60" y="171" fill="#ff9550" font-size="19" font-weight="800">CSE STUDENT • FULL-STACK BUILDER • AI/ML EXPLORER</text>
 <text x="60" y="207" fill="#d8c9c0" font-size="16">Turning ideas into useful software, one mission at a time.</text>
 <rect x="58" y="248" width="440" height="72" rx="13" fill="#111824" stroke="#ff8542" stroke-opacity=".75"/>
 <circle cx="82" cy="273" r="5" fill="#ff8a3c"/><text x="100" y="278" fill="#ffb36b" font-size="13" font-weight="800" letter-spacing="1.5">CURRENT MISSION</text>
 <text x="82" y="302" fill="#f2e5dc" font-size="15">Learn • Build • Improve • Repeat</text>
 <text x="60" y="368" fill="#998d8a" font-size="12" letter-spacing="2">IIUC • CHATTOGRAM, BANGLADESH</text>
 <text x="60" y="393" fill="#ff9b55" font-size="11" letter-spacing="2">忍道 — THE WAY OF THE SHINOBI</text>
</g>
