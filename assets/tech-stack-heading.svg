<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="124" viewBox="0 0 1200 124" role="img" aria-labelledby="title desc">
  <title id="title">TECH STACK</title>
  <desc id="desc">Tools and technologies used while building and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1b"/><stop offset=".5" stop-color="#0b1730"/><stop offset="1" stop-color="#091a2a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset=".55" stop-color="#dbeafe"/><stop offset="1" stop-color="#a78bfa"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#38bdf8" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="1196" height="120" rx="18" fill="url(#bg)" stroke="#38bdf8" stroke-opacity=".65" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="120" rx="18" fill="url(#grid)"/>
  <path d="M6 105 C170 76 270 130 440 102 S740 75 910 103 S1090 123 1194 94" fill="none" stroke="url(#shine)" stroke-opacity=".45" stroke-width="2">
    <animate attributeName="d" values="M6 105 C170 76 270 130 440 102 S740 75 910 103 S1090 123 1194 94;M6 99 C170 127 270 80 440 102 S740 124 910 96 S1090 80 1194 103;M6 105 C170 76 270 130 440 102 S740 75 910 103 S1090 123 1194 94" dur="9s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(42 25)" filter="url(#glow)">
    <rect width="65" height="65" rx="14" fill="#08162a" stroke="url(#shine)" stroke-width="2"/>
    <text x="32.5" y="43" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="url(#shine)">⚙</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="850" letter-spacing=".3">
    <text x="132" y="74" fill="#020617" stroke="#020617" stroke-width="8" stroke-linejoin="round">TECH STACK</text>
    <text x="132" y="69" fill="#172554" stroke="#a78bfa" stroke-opacity=".9" stroke-width="2.5" stroke-linejoin="round">TECH STACK</text>
    <text x="132" y="64" fill="url(#shine)" stroke="#eff6ff" stroke-opacity=".55" stroke-width=".8" stroke-linejoin="round">TECH STACK</text>
  </g>
  <text x="135" y="94" font-family="Segoe UI, Arial, sans-serif" fill="#b9c7e5" font-size="15">Tools and technologies used while building and learning.</text>
  <g transform="translate(1017 29)">
    <rect width="145" height="28" rx="14" fill="#08162a" stroke="#38bdf8" stroke-opacity=".7"/>
    <circle cx="15" cy="14" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18.5" font-family="Segoe UI, Arial, sans-serif" fill="#dbeafe" font-size="11.5" font-weight="700" letter-spacing=".5">LIVE • LEARNING</text>
  </g>
  <path d="M42 108H235" stroke="url(#shine)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M42 108H235;M42 108H360;M42 108H235" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>