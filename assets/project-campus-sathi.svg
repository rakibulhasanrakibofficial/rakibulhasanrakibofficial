<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="195" viewBox="0 0 1200 195" role="img" aria-labelledby="title desc">
  <title id="title">CampusSathi AI</title>
  <desc id="desc">A campus-focused AI assistant exploring practical support for students.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060c19"/><stop offset=".55" stop-color="#0a1830"/><stop offset="1" stop-color="#071b2c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"><animate attributeName="stop-color" values="#6366f1;#22d3ee;#6366f1" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#22d3ee" stroke-opacity=".06"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="1196" height="191" rx="20" fill="url(#bg)" stroke="#22d3ee" stroke-opacity=".64" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="191" rx="20" fill="url(#grid)"/>
  <ellipse cx="65" cy="95" rx="105" ry="100" fill="url(#aura)"><animate attributeName="opacity" values=".5;1;.5" dur="6s" repeatCount="indefinite"/></ellipse>
  <rect x="22" y="22" width="76" height="76" rx="18" fill="#07152a" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
  <text x="60" y="74" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#accent)">AI</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="850">
    <text x="116" y="62" fill="#020617" stroke="#020617" stroke-width="7" stroke-linejoin="round">CampusSathi AI</text>
    <text x="116" y="58" fill="#172554" stroke="#6366f1" stroke-width="1.6" stroke-linejoin="round">CampusSathi AI</text>
    <text x="116" y="54" fill="url(#accent)" stroke="#eff6ff" stroke-opacity=".45" stroke-width=".6" stroke-linejoin="round">CampusSathi AI</text>
  </g>
  <text x="117" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#dbeafe">A campus-focused AI assistant exploring practical support for students.</text>
  <g transform="translate(116 143)"><rect width="92" height="28" rx="14" fill="#0b1a30" stroke="#22d3ee" stroke-opacity=".75"/><text x="46" y="18.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" fill="#dbeafe" font-size="13" font-weight="600">AI</text></g><g transform="translate(220 143)"><rect width="174" height="28" rx="14" fill="#0b1a30" stroke="#6366f1" stroke-opacity=".75"/><text x="87" y="18.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" fill="#dbeafe" font-size="13" font-weight="600">Student Tool</text></g>
  <g transform="translate(1085 67)" filter="url(#glow)">
    <circle cx="28" cy="28" r="26" fill="#07152a" stroke="url(#accent)" stroke-width="1.6"/>
    <path d="M14 28H40M31 19L40 28L31 37" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <path d="M24 177H390" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"><animate attributeName="d" values="M24 177H390;M24 177H520;M24 177H390" dur="5s" repeatCount="indefinite"/></path>
  <circle cx="1150" cy="25" r="3" fill="#6366f1"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>