<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Rakibul Hasan Rakib — Shinobi Developer</title>
<desc id="desc">Animated dark neon portfolio banner with an original hooded shinobi character, glowing orange accents and developer profile details.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset=".55" stop-color="#171326"/><stop offset="1" stop-color="#101d32"/></linearGradient>
  <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd27a"/><stop offset=".45" stop-color="#ff873d"/><stop offset="1" stop-color="#e84324"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#ff8b43" stop-opacity=".35"/><stop offset="1" stop-color="#ff8b43" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8791ad" stroke-opacity=".09"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/><rect width="1200" height="430" rx="24" fill="url(#grid)"/>
<circle cx="970" cy="190" r="210" fill="url(#glow)"/>
<g fill="none" stroke="#ff8a45" stroke-opacity=".42"><circle cx="960" cy="200" r="158" stroke-dasharray="4 12"><animateTransform attributeName="transform" type="rotate" from="0 960 200" to="360 960 200" dur="48s" repeatCount="indefinite"/></circle><circle cx="960" cy="200" r="128" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="360 960 200" to="0 960 200" dur="35s" repeatCount="indefinite"/></circle></g>
<g font-family="monospace" font-size="14" fill="#6ee7c8"><text x="54" y="52">shinobi@rakib ~ $ summon --profile</text></g>
<text x="54" y="112" font-family="Arial,sans-serif" font-size="28" fill="#f3e9e3">Hi, I'm</text>
<text x="50" y="174" font-family="Arial,sans-serif" font-size="57" font-weight="800" fill="url(#fire)">Rakibul Hasan Rakib</text>
<text x="56" y="215" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffb36e">CSE Student  •  Full-Stack Builder  •  AI/ML Explorer</text>
<text x="56" y="254" font-family="Arial,sans-serif" font-size="18" fill="#d6d5df">Turning ideas into useful software, one mission at a time.</text>
<g font-family="Arial,sans-serif">
 <rect x="56" y="286" width="190" height="72" rx="13" fill="#171d2d" stroke="#e77c43"/><text x="76" y="316" fill="#ffad64" font-size="26" font-weight="700">BUILD</text><text x="76" y="340" fill="#c7c8d3" font-size="12" letter-spacing="2">LEARN • SHIP • REPEAT</text>
 <rect x="260" y="286" width="190" height="72" rx="13" fill="#171d2d" stroke="#438fce"/><text x="280" y="316" fill="#75baff" font-size="26" font-weight="700">CREATE</text><text x="280" y="340" fill="#c7c8d3" font-size="12" letter-spacing="2">CODE WITH PURPOSE</text>
</g>
<!-- Original stylized shinobi mascot -->
