<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">What I Build and My Interests</title><desc id="d">Two Naruto-inspired mission panels with rotating interest cards and animated progress indicators.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10131c"/><stop offset="1" stop-color="#281512"/></linearGradient><linearGradient id="hot"><stop stop-color="#ffd08a"/><stop offset=".5" stop-color="#ff762e"/><stop offset="1" stop-color="#b72a26"/></linearGradient></defs><rect width="1200" height="330" rx="18" fill="#0d1119"/><g transform="translate(16 16)"><rect width="568" height="298" rx="16" fill="url(#bg)" stroke="#ff7739" stroke-opacity=".75"/><text x="26" y="42" fill="#ffb36b" font-family="Segoe UI,Arial" font-size="21" font-weight="900">02 • WHAT I BUILD</text><text x="26" y="65" fill="#cfc3bb" font-family="Segoe UI,Arial" font-size="12">My current development missions</text><g font-family="Segoe UI,Arial" font-size="15" fill="#f4e8df"><g transform="translate(26 96)"><rect width="516" height="42" rx="9" fill="#1b202a" stroke="#8b3c2a"/><text x="16" y="26">⚔  Full-stack web applications</text><rect x="370" y="15" width="126" height="7" rx="3.5" fill="#44302c"/><rect x="370" y="15" width="82" height="7" rx="3.5" fill="url(#hot)"/></g><g transform="translate(26 150)"><rect width="516" height="42" rx="9" fill="#1b202a" stroke="#8b3c2a"/><text x="16" y="26">🌀  AI-powered student tools</text><rect x="370" y="15" width="126" height="7" rx="3.5" fill="#44302c"/><rect x="370" y="15" width="70" height="7" rx="3.5" fill="url(#hot)"/></g><g transform="translate(26 204)"><rect width="516" height="42" rx="9" fill="#1b202a" stroke="#8b3c2a"/><text x="16" y="26">🧩  Problem-solving & software projects</text><rect x="370" y="15" width="126" height="7" rx="3.5" fill="#44302c"/><rect x="370" y="15" width="94" height="7" rx="3.5" fill="url(#hot)"/></g></g><text x="26" y="277" fill="#988b82" font-family="Segoe UI,Arial" font-size="11">Progress bars are decorative, not measured skill ratings.</text></g><g transform="translate(616 16)"><rect width="568" height="298" rx="16" fill="url(#bg)" stroke="#ff7739" stroke-opacity=".75"/><text x="26" y="42" fill="#ffb36b" font-family="Segoe UI,Arial" font-size="21" font-weight="900">03 • INTEREST CAROUSEL</text><text x="26" y="65" fill="#cfc3bb" font-family="Segoe UI,Arial" font-size="12">Rotating areas I am exploring</text><g font-family="Segoe UI,Arial" text-anchor="middle"><g><rect x="35" y="92" width="498" height="145" rx="14" fill="#1b202a" stroke="#ff8b42"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.38;.43;.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="284" y="145" fill="#ff9a52" font-size="31" font-weight="900"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.38;.43;.95;1" dur="12s" repeatCount="indefinite"/>01 / BUILD</text><text x="284" y="180" fill="#f2e8e1" font-size="20"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.38;.43;.95;1" dur="12s" repeatCount="indefinite"/>Software & creative projects</text><text x="284" y="208" fill="#b8aaa1" font-size="12"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.38;.43;.95;1" dur="12s" repeatCount="indefinite"/>Design • Code • Iterate</text></g><g><rect x="35" y="92" width="498" height="145" rx="14" fill="#1b202a" stroke="#ff8b42" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.38;.43;.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="284" y="145" fill="#ff9a52" font-size="31" font-weight="900" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.38;.43;.95;1" dur="12s" repeatCount="indefinite"/>02 / EXPLORE</text><text x="284" y="180" fill="#f2e8e1" font-size="20" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.38;.43;.95;1" dur="12s" repeatCount="indefinite"/>AI / Machine Learning</text><text x="284" y="208" fill="#b8aaa1" font-size="12" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.38;.43;.95;1" dur="12s" repeatCount="indefinite"/>Experiments • Research • Learning</text></g></g><g transform="translate(250 260)" fill="#ff9b55"><circle cx="0" cy="0" r="4"><animate attributeName="opacity" values="1;.25;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="22" cy="0" r="4" opacity=".35"><animate attributeName="opacity" values=".35;1;.35" dur="12s" repeatCount="indefinite"/></circle></g><text x="284" y="282" fill="#988b82" font-family="Segoe UI,Arial" font-size="11" text-anchor="middle">Automatic SVG carousel • no JavaScript</text></g></svg>