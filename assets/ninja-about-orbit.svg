 <text x="585" y="70" fill="#ffb36b" font-size="13" font-weight="800" letter-spacing="4">// MY NINJA WAY</text>
 <text x="585" y="111" fill="#fff2e9" font-size="31" font-weight="900">Believe it — then ship it</text>
 <text x="585" y="139" fill="#cfc3bb" font-size="15">CSE student by day, anime-web builder by night.</text>
