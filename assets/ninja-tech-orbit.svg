<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Jutsu Arsenal — Tech Orbit</title><desc id="d">Technology labels orbit a glowing chakra core, with a grouped grid of programming and web tools.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d121d"/><stop offset="1" stop-color="#261513"/></linearGradient><linearGradient id="hot"><stop stop-color="#ffd08a"/><stop offset=".55" stop-color="#ff762e"/><stop offset="1" stop-color="#c52b2c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="430" rx="18" fill="url(#bg)" stroke="#ff7838" stroke-opacity=".75"/><text x="34" y="42" fill="#ffb36b" font-family="Segoe UI,Arial" font-size="21" font-weight="900">04 • JUTSU ARSENAL — TECH ORBIT</text><text x="34" y="65" fill="#cfc3bb" font-family="Segoe UI,Arial" font-size="12">Tools I use and technologies I am learning</text><g transform="translate(290 238)"><circle r="143" fill="none" stroke="#ff7a35" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 9"/><circle r="108" fill="none" stroke="#ffb36b" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="3 7"/><circle r="62" fill="#241914" stroke="url(#hot)" stroke-width="3" filter="url(#glow)"><animate attributeName="r" values="59;64;59" dur="4s" repeatCount="indefinite"/></circle><text y="-3" text-anchor="middle" fill="#ffbd80" font-family="Segoe UI,Arial" font-size="16" font-weight="900">CODE</text><text y="19" text-anchor="middle" fill="#f2e8e1" font-family="Segoe UI,Arial" font-size="11">CHAKRA CORE</text><g font-family="Segoe UI,Arial" font-size="14" font-weight="800" text-anchor="middle"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/><g transform="translate(0 -143)"><circle r="28" fill="#201b20" strok